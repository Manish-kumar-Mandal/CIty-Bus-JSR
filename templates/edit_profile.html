{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Edit Profile</title>

<style>

body{
background:#0b1d3a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.box{
background:white;
padding:30px;
border-radius:15px;
width:350px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#003b8f;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h2>Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}
<label>Profile Photo</label><br>
<input type="file" name="profile_image"><br><br>

<input type="text" name="full_name" value="{{ request.user.first_name }}" placeholder="Name">

<input type="email" name="email" value="{{ request.user.email }}" placeholder="Email">
<input type="phone" name="phone" value="{{ request.user.phone }}" placeholder="Phone">

<button>Save Changes</button>

</form>

</div>

</body>
</html>
